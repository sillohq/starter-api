[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starter"
version = "0.1.0"
description = "A clean JSON API built with Sillo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sillo-framework>=1.0.0rc1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.sillo]
app = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
